<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - Тренажёр слепой печати</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Дополнительные стили для формы регистрации */
    .register-container {
      max-width: 400px;
      margin: 50px auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .register-container h2 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
    }
    .register-container label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 500;
    }
    .register-container input {
      width: 100%;
      padding: 10px;
      border: 2px solid #bdc3c7;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .register-container input:focus {
      border-color: #3498db;
      outline: none;
    }
    .register-container .btn {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background: #2ecc71;
      color: white;
      border: none;
      border-radius: 30px;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .register-container .btn:hover {
      background: #27ae60;
    }
    .register-container .message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
    .register-container .link {
      text-align: center;
      margin-top: 15px;
    }
    .register-container .link a {
      color: #3498db;
      text-decoration: none;
    }
    .register-container .link a:hover {
      text-decoration: underline;
    }
    .error {
      color: #e74c3c;
    }
    .success {
      color: #2ecc71;
    }
  </style>
</head>
<body>
<div class="register-container">
  <h2>📝 Регистрация</h2>
  <form id="registerForm">
    <label for="username">Имя пользователя</label>
    <input type="text" id="username" placeholder="Введите имя" required>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Введите email" required>

    <label for="password">Пароль</label>
    <input type="password" id="password" placeholder="Введите пароль" required minlength="6">

    <button type="submit" class="btn">Зарегистрироваться</button>
    <div id="message" class="message"></div>
  </form>
  <div class="link">
    Уже есть аккаунт? <a href="index.html">Войти</a> (пока только регистрация)
  </div>
</div>

<script src="register.js"></script>
</body>
</html>
